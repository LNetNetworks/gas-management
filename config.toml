# Bloques opcionales. Si no estan, el servicio arranca con estos mismos valores y ambas
# capacidades quedan apagadas: descomentar solo lo que se quiera cambiar.

# [reorder]
# enabled = false             # tracker de nonces, retencion de la metatx adelantada y watcher de
#                             # resultados. Apagado, ninguno de los tres actua
# windowMs = 3000             # cuanto puede estar retenida una metatx SIN que avance el nonce
#                             # esperado de su usuario. Es tambien la gracia antes de olvidar a un
#                             # usuario que se quedo sin metatx en vuelo
# maxInflightPerUser = 16     # tope de metatx del mismo usuario en vuelo o retenidas
# receiptTimeoutMs = 60000    # cuanto se espera el resultado antes de darlo por indeterminado
# autoNonce = false           # repartir nonces: las consultas del mismo usuario se serializan y
#                             # cada una se lleva un numero distinto. Apagado, consultar no reserva
# autoNonceTicketMs = 2000    # cuanto se espera la metatx que use un nonce entregado antes de que
#                             # ese mismo numero vuelva a entregarse

# [dashboard]
# enabled = false             # publicar los eventos en el bus en memoria
# bufferSize = 500            # eventos retenidos para el que se conecta tarde; 0 deja el bus inerte

# [log]
# level = "info"              # debug, info, warn o error: nivel minimo que se escribe en la salida
# rawTx = false               # volcar la transaccion firmada completa (por defecto solo hash y tamano)

# [cors]
# Origenes que pueden llamar al servicio desde un navegador. Vacio -el default- no emite ninguna
# cabecera, que es como se comporta el servicio desde siempre. "*" autoriza a cualquiera.
# allowedOrigins = ["https://mi-dapp.example"]
